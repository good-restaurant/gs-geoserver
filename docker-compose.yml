version: "3.8"

services:
  geoserver:
    image: kartoza/geoserver:latest
    container_name: grsrv_geoserver
    ports:
      - "18080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_PASSWORD}
      - GEOSERVER_DATA_DIR=/opt/geoserver/data_dir
    volumes:
      - geoserver_data:/opt/geoserver/data_dir

    networks:
      - gr_network

    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080/geoserver/web/ || exit 1" ]
      interval: 10s
      retries: 30
      timeout: 5s

networks:
  gr_network:

volumes:
  geoserver_data:
